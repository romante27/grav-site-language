title: 'FAQ section'
'@extends': default

form:
  fields:
    tabs:
      fields:
        faq:
          type: tab
          title: 'FAQ section'
          fields:
            header.eyebrow:
              type: text
              label: 'Eyebrow'
            header.heading:
              type: textarea
              rows: 2
              label: 'Heading'
              help: 'HTML allowed: use <em>текст</em> for the oxblood italic accent.'
            header.intro:
              type: textarea
              rows: 2
              label: 'Intro'
            header.items:
              type: list
              label: 'Questions'
              fields:
                .question:
                  type: text
                  label: 'Question'
                .answer:
                  type: textarea
                  rows: 3
                  label: 'Answer'
