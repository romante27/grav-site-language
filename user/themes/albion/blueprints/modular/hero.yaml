title: 'Hero'
'@extends': default

form:
  fields:
    tabs:
      fields:
        hero:
          type: tab
          title: 'Hero'
          fields:
            header.eyebrow:
              type: text
              label: 'Eyebrow'
            header.availability:
              type: text
              label: 'Availability note'
            header.heading_lines:
              type: list
              label: 'Heading lines'
              fields:
                .text:
                  type: text
                  label: 'Text'
                .accent:
                  type: toggle
                  label: 'Italic oxblood accent'
                  highlight: 1
                  options:
                    1: 'Yes'
                    0: 'No'
            header.lead:
              type: textarea
              rows: 3
              label: 'Lead'
            header.badge_kicker:
              type: text
              label: 'Illustration badge kicker'
            header.badge_value:
              type: text
              label: 'Illustration badge value'
            header.badge_caption:
              type: text
              label: 'Illustration badge caption'
            header.primary_label:
              type: text
              label: 'Primary button label'
            header.primary_url:
              type: text
              label: 'Primary button URL'
            header.secondary_label:
              type: text
              label: 'Secondary button label'
            header.secondary_url:
              type: text
              label: 'Secondary button URL'
            header.meta:
              type: list
              label: 'Trust items'
              fields:
                .text:
                  type: text
                  label: 'Text'
