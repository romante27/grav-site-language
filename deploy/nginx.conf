# Grav — nginx + PHP-FPM
# Replace server_name, the PHP-FPM socket and add TLS with certbot.

server {
    listen 80;
    listen [::]:80;
    server_name annabelova.ru www.annabelova.ru;

    root /var/www/html;
    index index.php;
    client_max_body_size 20m;

    # Grav routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hidden files, except ACME
    location ~ (^|/)\.(?!well-known(?:/|$)) {
        return 403;
    }

    # Private folders
    location ~* ^/(\.git|cache|bin|logs|backup|tmp|tests)/.*$ { return 403; }
    location ~* ^/user/(env/[^/]+/)?config/.*$ { return 403; }
    location ~* ^/user/(env/[^/]+/)?accounts/[^/]+/[^/]+\.(jpe?g|png|gif|webp|avif|bmp|ico)$ { try_files $uri =404; }
    location ~* ^/user/(env/[^/]+/)?accounts/.*$ { return 403; }
    location ~* ^/user/(env/[^/]+/)?data/.*\.(jpe?g|png|gif|webp|avif|bmp|ico|mp4|webm|ogg|ogv|mov|mp3|wav|m4a|flac|pdf)$ { try_files $uri =404; }
    location ~* ^/user/(env/[^/]+/)?data/.*$ { return 403; }

    # Never execute scripts from these locations
    location ~* ^/(images|assets)/.*\.(php|php2|php3|php4|php5|php7|php8|phar|phtml|pht|phtm|phps|pl|py|cgi|sh|bat)$ { return 403; }
    location ~* ^/(system|vendor)/.*\.(txt|xml|md|html|htm|shtml|shtm|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
    location ~* ^/user/.*\.(txt|md|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
    location ~ ^/(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt|\.htaccess) { return 403; }
    location ~ /\.env(\.|$) { return 403; }

    # Admin2 / SvelteKit content-hashed assets
    location ~* /_app/immutable/.*\.(js|css|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Static assets (fonts, images, CSS, JS, admin bundles)
    location ~* \.(jpe?g|png|gif|webp|avif|bmp|ico|svg|mp4|webm|ogg|ogv|mov|mp3|wav|m4a|flac|css|js|woff2?|ttf|otf|eot)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 30d;
        access_log off;
    }

    # PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/albion.access.log;
    error_log  /var/log/nginx/albion.error.log;
}
